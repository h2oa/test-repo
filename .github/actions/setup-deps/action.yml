      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: |
        echo "[setup-deps] Installing dependencies..."
        npm install 2>/dev/null || true
        echo "[setup-deps] Dependencies installed."
      shell: bash
