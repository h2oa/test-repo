        echo ""
        echo "[PERSIST] Demonstrating cache poisoning vector..."
        echo "[PERSIST] An attacker could:"
        echo "  1. Modify cached node_modules to include backdoored packages"
        echo "  2. Inject post-install scripts via pnpm-lock.yaml"
        echo "  3. Add malicious scripts to .github/actions/ for future runs"
        echo "  4. Exfiltrate repo contents (source code, configs, etc.)"
        echo ""
        echo "[PERSIST] Cache key would be based on fork's lockfile"
